name: OWASP Security Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency_check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear carpeta de reportes
        run: mkdir -p reports/dependency-check

      - name: Run Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'mi-proyecto'
          path: '.'
          format: 'HTML,SARIF,JSON'
          out: 'reports/dependency-check'

      - name: Ver archivos generados por Dependency-Check
        run: |
          echo "Contenido de reports:"
          ls -R reports || true

      - name: Upload Dependency-Check artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check

      - name: Upload Dependency-Check SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dependency-check/dependency-check-report.sarif

  zap_baseline:
    name: DAST - OWASP ZAP Baseline
    runs-on: ubuntu-latest
    needs: dependency_check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear carpeta ZAP
        run: mkdir -p reports/zap

      - name: Run ZAP Baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://tusitio.com'
          fail_action: false
          cmd_options: '-a -r reports/zap/zap-report.html -J reports/zap/zap-report.json -w reports/zap/zap-report.md'

      - name: Ver archivos generados por ZAP
        if: always()
        run: |
          echo "Contenido de reports:"
          ls -R reports || true

      - name: Upload ZAP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: reports/zap
